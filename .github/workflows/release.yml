name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version to release (e.g. 1.0.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (build and test without publishing to NuGet or creating release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Validate & Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_prerelease: ${{ steps.get_version.outputs.is_prerelease }}
    steps:
      - name: Extract Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ inputs.version }}"
          else
            RAW_VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${RAW_VERSION}" >> $GITHUB_OUTPUT

          if [[ "${RAW_VERSION}" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "Releasing version: ${RAW_VERSION}"

  build-cli:
    name: Build CLI (${{ matrix.target.rid }})
    needs: validate
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: ubuntu-latest, rid: linux-x64, archive: tar.gz, binary: SchematicBuilderMC }
          - { os: ubuntu-latest, rid: linux-arm64, archive: tar.gz, binary: SchematicBuilderMC }
          - { os: windows-latest, rid: win-x64, archive: zip, binary: SchematicBuilderMC.exe }
          - { os: windows-latest, rid: win-arm64, archive: zip, binary: SchematicBuilderMC.exe }
          - { os: macos-latest, rid: osx-x64, archive: tar.gz, binary: SchematicBuilderMC }
          - { os: macos-latest, rid: osx-arm64, archive: tar.gz, binary: SchematicBuilderMC }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish Single-File CLI
        run: >
          dotnet publish ./src/SchematicBuilderMC/SchematicBuilderMC.csproj
          --configuration Release
          --runtime ${{ matrix.target.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ needs.validate.outputs.version }}
          -p:ContinuousIntegrationBuild=true
          --output ./publish

      - name: Archive Binary (Unix)
        if: matrix.target.archive == 'tar.gz'
        run: |
          cp README.md LICENSE ./publish/
          tar -czvf "SchematicBuilderMC-${{ needs.validate.outputs.version }}-${{ matrix.target.rid }}.tar.gz" -C ./publish .

      - name: Archive Binary (Windows)
        if: matrix.target.archive == 'zip'
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE -Destination ./publish/
          Compress-Archive -Path ./publish/* -DestinationPath "SchematicBuilderMC-${{ needs.validate.outputs.version }}-${{ matrix.target.rid }}.zip"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target.rid }}
          path: |
            *.tar.gz
            *.zip

  pack-nuget:
    name: Build & Pack NuGet
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore ./src

      - name: Build Solution
        run: >
          dotnet build ./src
          --configuration Release
          --no-restore
          -p:Version=${{ needs.validate.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: Pack NuGet Packages
        run: >
          dotnet pack ./src/SchematicBuilderMC.Core/SchematicBuilderMC.Core.csproj
          --configuration Release
          --no-build
          -p:Version=${{ needs.validate.outputs.version }}
          --output ./nupkg

      - name: Pack CLI Global Tool
        run: >
          dotnet pack ./src/SchematicBuilderMC/SchematicBuilderMC.csproj
          --configuration Release
          --no-build
          -p:Version=${{ needs.validate.outputs.version }}
          --output ./nupkg

      - name: Upload NuGet Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./nupkg/*

      - name: Publish to GitHub Packages
        if: ${{ !inputs.dry_run }}
        run: |
          dotnet nuget add source --username "${{ github.repository_owner }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" || true
          dotnet nuget push ./nupkg/*.nupkg --source github --skip-duplicate

      - name: Publish to NuGet.org
        if: ${{ !inputs.dry_run && secrets.NUGET_API_KEY != '' }}
        run: |
          dotnet nuget push ./nupkg/*.nupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  create-release:
    name: Create GitHub Release
    needs: [validate, build-cli, pack-nuget]
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release-assets

      - name: Organize Release Assets & Compute Checksums
        run: |
          mkdir -p ./dist
          find ./release-assets -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.nupkg" -o -name "*.snupkg" \) -exec cp {} ./dist/ \;
          cd ./dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: v${{ needs.validate.outputs.version }}
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            ./dist/*
